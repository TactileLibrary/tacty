name: Build and Release tacty

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache libfuse2 build-essential

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Cache Nuitka compiler data
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuitka-cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Build with pyside-deploy in standalone mode
        run: uv run pyside6-deploy -c ./pysidedeploy-linux.spec

      - name: Create AppImage
        run: |
          wget -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          mkdir -p AppDir/usr/bin
          cp -r dist/tacty.dist/* AppDir/usr/bin/

          if [ -f "AppDir/usr/bin/run.bin" ]; then
            mv AppDir/usr/bin/run.bin AppDir/usr/bin/tacty
          elif [ -f "AppDir/usr/bin/run" ]; then
            mv AppDir/usr/bin/run AppDir/usr/bin/tacty
          fi

          chmod +x AppDir/usr/bin/tacty

          cd AppDir
          ln -s usr/bin/tacty AppRun
          cd ..

          cp linux/tacty.desktop AppDir/
          cp src/tacty/resources/icons/tl.png AppDir/tacty.png

          ./appimagetool --appimage-extract-and-run AppDir tacty-${{ github.ref_name }}-${{ runner.arch }}.AppImage

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: tacty-${{ github.ref_name }}-${{ runner.arch }}.AppImage

  build-windows:
    runs-on: windows-latest
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Nuitka compiler data
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuitka-cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Build with pyside-deploy in standalone mode
        run: uv run pyside6-deploy -c ./pysidedeploy-windows.spec

      - name: Rename Binary
        shell: pwsh
        run: |
          Move-Item "dist/tacty.dist/run.exe" "dist/tacty.dist/Tacty.exe"

      - name: Compile Inno Setup Installer
        run: iscc windows/installer.iss

      - name: Rename Installer
        shell: pwsh
        run: |
          Move-Item "Output/tacty-windows-installer.exe" "Output/tacty-${{ github.ref_name }}-${{ runner.arch }}.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Output/tacty-${{ github.ref_name }}-${{ runner.arch }}.exe

  build-macos:
    runs-on: macos-latest
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Cache Nuitka compiler data
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuitka-cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Build with pyside-deploy
        run: uv run pyside6-deploy -c ./pysidedeploy-macos.spec

      - name: Package as DMG
        run: |
          mkdir dmg_root
          cp -r dist/tacty.app dmg_root/
          hdiutil create -volname "Tacty" -srcfolder dmg_root -ov -format UDZO tacty-${{ github.ref_name }}-${{ runner.arch }}.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: tacty-${{ github.ref_name }}-${{ runner.arch }}.dmg

  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Extract version
        id: changelog_reader
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog_reader.outputs.release-notes }}
          append_body: false
          files: |
            tacty-${{ github.ref_name }}-*
