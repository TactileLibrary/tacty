name: Build and Release tacty

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache libfuse2 build-essential

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Cache Nuitka compiler data
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Build with pyside-deploy in standalone mode
        run: uv run pyside6-deploy -c ./pysidedeploy-linux.spec

      - name: Create AppImage
        run: |
          wget -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          mkdir -p AppDir/usr/bin
          cp -r dist/tacty.dist/* AppDir/usr/bin/

          if [ -f "AppDir/usr/bin/run.bin" ]; then
            mv AppDir/usr/bin/run.bin AppDir/usr/bin/tacty
          elif [ -f "AppDir/usr/bin/run" ]; then
            mv AppDir/usr/bin/run AppDir/usr/bin/tacty
          fi

          chmod +x AppDir/usr/bin/tacty

          cd AppDir
          ln -s usr/bin/tacty AppRun
          cd ..

          cp linux/tacty.desktop AppDir/
          cp src/tacty/resources/icons/tl.png AppDir/tacty.png

          ./appimagetool --appimage-extract-and-run AppDir tacty-linux-x86_64.AppImage

      - name: Extract version
        id: kacl
        uses: zogot/kacl-parser@1.0.0
        with:
          version: ${{ github.ref_name }}

      - name: Upload Linux Artifact
        uses: softprops/action-gh-release@v2
        with:
          body: $ {{ steps.kacl.outputs.release }}
          files: tacty-linux-x86_64.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Nuitka compiler data
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Build with pyside-deploy in standalone mode
        run: uv run pyside6-deploy -c ./pysidedeploy-windows.spec

      - name: Rename Binary
        shell: pwsh
        run: |
          Move-Item "dist/tacty.dist/run.exe" "dist/tacty.dist/Tacty.exe"

      - name: Compile Inno Setup Installer
        run: iscc windows/installer.iss

      - name: Extract version
        id: kacl
        uses: zogot/kacl-parser@1.0.0
        with:
          version: ${{ github.ref_name }}

      - name: Upload Windows Artifact
        uses: softprops/action-gh-release@v2
        with:
          body: $ {{ steps.kacl.outputs.release }}
          files: Output/tacty-windows-installer.exe
